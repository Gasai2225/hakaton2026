name: Garden security checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      project:
        description: Учебный проект для сохранённого сценария
        type: choice
        default: reading-room
        options:
          - reading-room
          - book-index
          - label-studio
          - parcel-ledger
      trigger:
        description: ID ручной ноды, если в графе их несколько
        type: string
        required: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: TBagirov/training
          ref: fe1fcbe212669783480666b9b60147c8a8c6eef4
          path: samples/training
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r backend/requirements.txt
      - name: Verify Repair Desk and synthetic controls
        working-directory: backend
        run: python -m unittest discover -s tests
      - name: Export the organizer's reference project
        working-directory: backend
        run: |
          status=0
          python -m garden.ci --project ../samples/training/training-project --output ../garden-report.json --html-output ../garden-report.html || status=$?
          # The reference deliberately includes a critical dependency.
          test "$status" -eq 1
      - name: Compare the exported findings with the organizer's reference
        working-directory: backend
        run: python -I tests/compare_submission.py ../garden-report.json ../samples/training/ground-truth/training-findings.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && hashFiles('garden-report.json') != ''
        with:
          name: garden-findings
          path: |
            garden-report.json
            garden-report.html

  saved-workflow:
    if: github.event_name != 'push' || (!github.event.deleted && startsWith(github.ref, 'refs/heads/'))
    runs-on: ubuntu-latest
    env:
      CHECKED_SHA: ${{ github.event.pull_request.head.sha || github.event.after || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CHECKED_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r backend/requirements.txt
      - name: Run the saved workflow on changed practice projects
        id: scan
        working-directory: backend
        run: python -m garden.ci_projects
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.scan.outputs.report_dir != ''
        with:
          name: saved-workflow-findings
          path: |
            ${{ steps.scan.outputs.report_dir }}/*.json
            ${{ steps.scan.outputs.report_dir }}/*.html
